name: New-term radar

# Two schedules, one state:
#   sources  every 8 hours: X and Hugging Face, where a name is said first. Posts a
#            report only when there is a new name.
#   daily    once a day: everything else, the review of leads from 14 days ago, and the
#            source leads of the last day.
#
# Off until you opt in: set the repository variable RADAR_ENABLED to "true"
# (Settings > Secrets and variables > Actions > Variables), and provide a complete
# schema-v2 config.json as the RADAR_CONFIG_JSON repository secret.
# Never commit config.json: it contains credentials. Cloud execution is opt-in.
#
# State (state/radar.db and the snapshots) lives in the Actions cache: one entry per
# run, restored by prefix, so the repository does not grow. A missing cache only means
# the next run builds new snapshots and reports nothing that day; the leads database
# would start over, so download the "radar-state" artifact now and then if you care
# about the review's history.

on:
  schedule:
    - cron: "0 0,8,16 * * *"   # sources
    - cron: "30 1 * * *"       # daily
  workflow_dispatch:
    inputs:
      command:
        description: "daily or sources"
        default: "daily"

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  radar:
    if: vars.RADAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMMAND: ${{ github.event.inputs.command || (github.event.schedule == '30 1 * * *' && 'daily' || 'sources') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: bash scripts/start-linux.sh setup

      - name: Materialize private file configuration
        env:
          RADAR_CONFIG_JSON: ${{ secrets.RADAR_CONFIG_JSON }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          raw = os.environ.get('RADAR_CONFIG_JSON', '')
          if not raw:
              raise SystemExit('Missing RADAR_CONFIG_JSON secret; no collection started')
          try:
              data = json.loads(raw)
          except ValueError:
              raise SystemExit('Invalid file configuration secret') from None
          Path('config.json').write_text(json.dumps(data), encoding='utf-8')
          Path('config.json').chmod(0o600)
          PY

      - name: Restore the state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}
          restore-keys: radar-state-

      - name: Run the radar
        run: |
          if [ "$COMMAND" = "daily" ]; then
            bash scripts/start-linux.sh daily --skip x,hf --out report.md
          elif [ "$COMMAND" = "sources" ]; then
            bash scripts/start-linux.sh sources --out report.md
          else
            echo 'Unsupported command' >&2; exit 2
          fi
          if [ -f report.md ]; then cat report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Save the state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}

      - name: Keep the report and the state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-${{ env.COMMAND }}-${{ github.run_id }}
          path: |
            report.md
            report.json
            state/radar.db
          if-no-files-found: ignore
          retention-days: 30
